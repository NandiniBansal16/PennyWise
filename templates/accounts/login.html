{% extends "auth_base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-9 col-sm-5 col-md-20 col-lg-12">

            <div class="card shadow mt-5">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h1 class="fw-bold text-primary">

                            PennyWise

                        </h1>

                    <p class="text-muted">

                        Welcome back!

                    </p>

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            required>

                        </div>

                        <button
                        class="btn btn-success w-100">

                            Login

                        </button>

                    </form>

                    <hr>

                    <p class="text-center">

                        New here?

                        <a href="{% url 'register' %}">
                            Create Account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
